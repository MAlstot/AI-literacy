<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before You Read: What Do You Already Think?</title>
<style>
  :root{
    --green:#154734; --gold:#FFB81C; --amber:#D99A1C;
    --accent:#5E8A93; --accent-dk:#2F5A62;
    --cream:#FAF6EC; --sage:#E7EFE9; --palegold:#FBF3DC;
    --char:#2B2B2B; --gray:#6F6F6F; --line:#D6D2C8; --brick:#9C3F2C;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{padding:12px;background:var(--cream);color:var(--char);
       font-family:Lato,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .hdr{background:var(--green);color:#fff;border-radius:10px 10px 0 0;padding:16px 20px;
       border-bottom:5px solid var(--accent)}
  .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
           color:var(--gold);margin:0 0 4px}
  .hdr h1{margin:0;font-size:1.28rem;font-weight:700}
  .hdr p{margin:6px 0 0;font-size:.94rem;color:#E3EDE7}

  .body{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:20px}

  .progress{display:flex;align-items:center;gap:8px;font-size:.75rem;font-weight:800;
            letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dk);margin:0 0 16px}
  .pips{display:flex;gap:5px;margin-left:auto}
  .pip{width:20px;height:5px;border-radius:3px;background:var(--line)}
  .pip.on{background:var(--accent)}
  .pip.done{background:var(--green)}

  .q{font-size:1.1rem;font-weight:700;color:var(--green);margin:0 0 4px;line-height:1.35}
  .qsub{font-size:.92rem;color:var(--gray);margin:0 0 14px}

  .opts{display:grid;gap:9px}
  .opt{width:100%;text-align:left;font:inherit;font-weight:600;color:var(--char);cursor:pointer;
       background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:13px 15px;
       transition:border-color .13s,background .13s}
  .opt:hover{border-color:var(--accent);background:#F7FAFA}
  .opt:focus-visible{outline:3px solid var(--green);outline-offset:2px}
  .opt[aria-pressed="true"]{border-color:var(--green);background:var(--sage);font-weight:700}

  .acts{margin-top:16px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .btn{font:inherit;font-weight:700;font-size:.93rem;cursor:pointer;border-radius:7px;
       padding:10px 18px;border:2px solid var(--green);background:var(--green);color:#fff}
  .btn:hover{background:#0F3627}
  .btn:focus-visible{outline:3px solid var(--accent-dk);outline-offset:2px}
  .btn.ghost{background:#fff;color:var(--green)}
  .btn.ghost:hover{background:var(--sage)}
  .btn[disabled]{opacity:.45;cursor:default}
  .hint{font-size:.85rem;color:var(--gray)}

  .summary{background:var(--cream);border:1px solid var(--line);border-top:5px solid var(--green);
           border-radius:10px;padding:20px;margin:4px 0 0}
  .scoreline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px}
  .scoreline .num{font-size:1.9rem;font-weight:800;color:var(--green);line-height:1}
  .scoreline .of{font-size:1rem;color:var(--gray);font-weight:700}
  .summary .intro{margin:0 0 16px;color:var(--char);font-size:.95rem}

  .rowlist{display:grid;gap:10px}
  .rowitem{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 15px}
  .rowitem.ok{border-left:5px solid var(--green)}
  .rowitem.no{border-left:5px solid var(--brick)}
  .tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.07em;
       text-transform:uppercase;color:#fff;padding:3px 9px;border-radius:20px;margin:0 0 7px}
  .tag.ok{background:var(--green)}
  .tag.no{background:var(--brick)}
  .rowitem .qq{font-size:.88rem;color:var(--gray);margin:0 0 4px;line-height:1.45}
  .rowitem .aa{font-weight:700;color:var(--char);margin:0 0 5px}
  .rowitem .where{font-size:.84rem;color:var(--accent-dk);font-weight:700;margin:0}
  .summary .tail{margin:16px 0 0;color:var(--char);font-size:.93rem;
                 background:var(--sage);border-left:4px solid var(--accent);
                 border-radius:0 7px 7px 0;padding:11px 14px}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <p class="eyebrow">Module 2 &middot; Evaluate the Ethics</p>
    <h1>Before You Read: What Do You Already Think?</h1>
    <p>Five quick questions. You get a score at the end, not the answers. Commit to what you think now.</p>
  </div>

  <div class="body">
    <div id="stage" aria-live="polite"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var Q = [
    {
      q: "A student writes prompts until an AI image generator produces exactly the graphic she wanted. Who holds the copyright?",
      sub: "Pick the one you would say if someone asked you right now.",
      opts: ["The student who wrote the prompts", "The company that made the AI tool", "Nobody holds it", "Whoever pays for the subscription"],
      a: 2,
      where: "Answered in: You Do Not Own It"
    },
    {
      q: "Writing hundreds of prompts and revisions can make you the legal author of an AI-generated image.",
      sub: "True or false?",
      opts: ["True", "False"],
      a: 1,
      where: "Answered in: You Do Not Own It"
    },
    {
      q: "You ask AI for a rough draft, then rewrite nearly every sentence yourself and restructure the whole thing. Can you copyright what you turned in?",
      sub: "Pick one.",
      opts: ["Yes, all of it", "Yes, the parts you wrote", "No, AI was involved", "Only if you disclose it"],
      a: 1,
      where: "Answered in: So what is actually yours?"
    },
    {
      q: "Enrolling at Baylor gives the university the copyright to the papers and projects you create here.",
      sub: "True or false?",
      opts: ["True", "False"],
      a: 1,
      where: "Answered in: Your Work at Baylor"
    },
    {
      q: "You downloaded a journal article through a Baylor Libraries database. Can you upload the PDF into an AI tool to summarize it?",
      sub: "Pick one.",
      opts: ["Yes, you have access to it", "Only into Copilot or Box AI", "No, not into any AI tool", "Only if you cite it afterward"],
      a: 2,
      where: "Answered in: The Other Half: What You Put In"
    }
  ];

  var stage = document.getElementById("stage");
  var idx = 0;
  var picked = Q.map(function(){ return null; });

  function pips(){
    var out = '<span class="pips" aria-hidden="true">';
    for (var i = 0; i < Q.length; i++){
      out += '<span class="' + (i === idx ? "pip on" : (picked[i] !== null ? "pip done" : "pip")) + '"></span>';
    }
    return out + '</span>';
  }

  function renderQuestion(){
    var item = Q[idx], sel = picked[idx], html = '';

    html += '<div class="progress">Question ' + (idx + 1) + ' of ' + Q.length + pips() + '</div>';
    html += '<p class="q">' + item.q + '</p>';
    html += '<p class="qsub">' + item.sub + '</p>';
    html += '<div class="opts" role="group" aria-label="Answer choices">';
    item.opts.forEach(function(t, i){
      html += '<button class="opt" type="button" data-i="' + i + '" aria-pressed="' + (sel === i) + '">' + t + '</button>';
    });
    html += '</div>';

    html += '<div class="acts">';
    html += '<button class="btn ghost" type="button" id="back"' + (idx === 0 ? ' disabled' : '') + '>Back</button>';
    html += '<button class="btn" type="button" id="fwd"' + (sel === null ? ' disabled' : '') + '>'
          + (idx === Q.length - 1 ? 'Done' : 'Next') + '</button>';
    if (sel === null) html += '<span class="hint">Pick an answer to continue.</span>';
    html += '</div>';

    stage.innerHTML = html;

    Array.prototype.forEach.call(stage.querySelectorAll(".opt"), function(b){
      b.addEventListener("click", function(){
        picked[idx] = parseInt(b.getAttribute("data-i"), 10);
        renderQuestion();
      });
    });
    var back = document.getElementById("back");
    if (back) back.addEventListener("click", function(){ if (idx > 0){ idx--; renderQuestion(); } });
    var fwd = document.getElementById("fwd");
    if (fwd) fwd.addEventListener("click", function(){
      if (idx === Q.length - 1){ renderSummary(); } else { idx++; renderQuestion(); }
    });

    bump();
  }

  function renderSummary(){
    var score = 0;
    Q.forEach(function(item, i){ if (picked[i] === item.a) score++; });

    var line;
    if (score === Q.length)  line = "You already knew all five. Read anyway: the reasons are more interesting than the answers.";
    else if (score >= 3)     line = "You knew most of them. The ones marked below are worth slowing down for.";
    else                     line = "Most people score here. Almost none of this is common knowledge yet.";

    var html = '<div class="summary">'
             + '<p class="scoreline"><span class="num">' + score + '</span>'
             + '<span class="of">out of ' + Q.length + '</span></p>'
             + '<p class="intro">' + line + ' You are not being shown the correct answers, on purpose. '
             + 'Each one below tells you where on this page it gets settled.</p>'
             + '<div class="rowlist">';
    Q.forEach(function(item, i){
      var right = (picked[i] === item.a);
      html += '<div class="rowitem ' + (right ? 'ok' : 'no') + '">'
            + '<span class="tag ' + (right ? 'ok' : 'no') + '">'
            + (right ? 'Correct' : 'Revisit this one') + '</span>'
            + '<p class="qq">' + (i + 1) + '. ' + item.q + '</p>'
            + '<p class="aa">You said: ' + item.opts[picked[i]] + '</p>'
            + '<p class="where">' + item.where + '</p>'
            + '</div>';
    });
    html += '</div>'
          + '<p class="tail">Come back and take it again after you finish the page.</p>'
          + '</div>';
    html += '<div class="acts"><button class="btn ghost" type="button" id="again">Take it again</button></div>';

    stage.innerHTML = html;
    var a = document.getElementById("again");
    if (a) a.addEventListener("click", function(){
      idx = 0; picked = Q.map(function(){ return null; }); renderQuestion();
    });
    bump();
  }

  /* --- Canvas iframe auto-resize (canonical pattern) --- */
  var PAD = 24, lastH = 0;
  function sendHeight(){
    try{
      var el = document.querySelector('.wrap');
      var h = (el ? el.offsetHeight : document.body.offsetHeight) + PAD;
      if (Math.abs(h - lastH) < 4) return;
      lastH = h;
      var msg = {subject:'lti.frameResize', height:h};
      window.parent.postMessage(msg,'*');
      window.parent.postMessage(JSON.stringify(msg),'*');
    }catch(e){}
  }
  function bump(){ setTimeout(sendHeight, 80); }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  if(window.ResizeObserver){
    var w = document.querySelector('.wrap');
    if(w) new ResizeObserver(sendHeight).observe(w);
  }

  renderQuestion();
})();
</script>
</body>
</html>
