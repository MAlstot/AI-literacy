<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Paths to a Finished Piece of Work</title>
<style>
  :root{
    --green:#154734; --brick:#9C3F2C; --slate:#2F5A62;
    --cream:#FAF6EC; --sage:#E7EFE9; --pink:#F7E9E5;
    --gray:#6F6F6F; --line:#B9B3A6;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    padding:0;background:transparent;color:#2B2B2B;
    font-family:Lato,"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:100%;line-height:1.5;
  }
  .wrap{
    max-width:660px;margin:0 auto;background:var(--cream);
    border:1px solid var(--line);border-radius:9px;padding:16px 14px 14px;
  }
  figure{margin:0}

  .cap{
    font-size:.75rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--slate);text-align:center;margin:0 0 14px;
  }

  .start{
    background:var(--green);color:#fff;border-radius:8px;
    padding:10px 14px;font-weight:700;font-size:.95rem;
    text-align:center;margin:0 0 4px;
  }
  .startnote{
    text-align:center;font-size:.8rem;color:var(--gray);margin:0 0 14px;
  }

  .path{margin:0 0 16px}
  .path:last-of-type{margin-bottom:12px}

  .plabel{
    font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    margin:0 0 2px;
  }
  .p1 .plabel{color:var(--green)}
  .p2 .plabel{color:var(--brick)}
  .psub{font-size:.85rem;color:var(--gray);margin:0 0 7px}

  .bar{display:flex;gap:6px;align-items:stretch}
  .seg{
    border-radius:6px;padding:9px 10px;text-align:center;
    display:flex;flex-direction:column;justify-content:center;min-height:62px;
  }
  .seg .t{font-weight:700;font-size:.9rem;line-height:1.25}
  .seg .s{font-size:.8rem;line-height:1.3;margin-top:2px}

  .whole{flex:1 1 100%;background:var(--sage);border:2px solid var(--green);color:var(--green)}
  .ai   {flex:3 1 0;background:var(--pink);border:2px dashed var(--brick);color:var(--brick)}
  .mine {flex:7 1 0;background:var(--sage);border:2px solid var(--green);color:var(--green)}

  .kicker{
    text-align:center;font-size:.88rem;color:var(--slate);
    margin:0;padding-top:10px;border-top:1px solid var(--line);
  }

  .desc{
    margin:12px 0 0;font-size:.85rem;line-height:1.5;color:#2B2B2B;
  }
  .desc summary{
    cursor:pointer;font-weight:700;color:var(--green);font-size:.85rem;
    padding:4px 0;
  }
  .desc summary:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}
  .desc p{margin:8px 0 0}

  @media (max-width:430px){
    .bar{flex-direction:column}
    .seg{min-height:0}
    .ai, .mine, .whole{flex:1 1 auto}
  }
</style>
</head>
<body>
<div class="wrap">
<figure>
  <figcaption class="cap">Two paths to a finished piece of work</figcaption>

  <p class="start">You make something</p>
  <p class="startnote">Both paths below produce the same amount of finished work.</p>

  <div class="path p1">
    <p class="plabel">Path 1 &middot; All human</p>
    <p class="psub">You write it, draw it, build it.</p>
    <div class="bar">
      <div class="seg whole">
        <span class="t">All of it is yours</span>
        <span class="s">one work, one author, no question</span>
      </div>
    </div>
  </div>

  <div class="path p2">
    <p class="plabel">Path 2 &middot; AI helps make it</p>
    <p class="psub">Same length of work. It arrives in two pieces.</p>
    <div class="bar">
      <div class="seg ai">
        <span class="t">AI-generated</span>
        <span class="s">nobody owns it</span>
      </div>
      <div class="seg mine">
        <span class="t">What you rewrote, arranged, changed</span>
        <span class="s">this part is yours</span>
      </div>
    </div>
  </div>

  <p class="kicker">The more of it you actually made, the more of it you hold.</p>

  <details class="desc">
    <summary>Text description of this diagram</summary>
    <p>Everything starts from one box: you make something. From there the diagram compares two routes to the same finished work.</p>
    <p>Path 1 is all human. You write it, draw it, or build it. The result is a single unbroken block labeled &ldquo;All of it is yours,&rdquo; with the note &ldquo;one work, one author, no question.&rdquo;</p>
    <p>Path 2 is AI helps make it. The same amount of finished work arrives in two pieces rather than one. The smaller piece, outlined with a dashed border, is labeled &ldquo;AI-generated, nobody owns it.&rdquo; The larger piece is labeled &ldquo;What you rewrote, arranged, changed. This part is yours.&rdquo;</p>
    <p>Both paths span the same total width, so they represent the same finished work. The difference is that the human path stays whole while the AI-assisted path is divided, and only the part you made is yours.</p>
  </details>
</figure>
</div>

<script>
(function(){
  "use strict";
  /* --- Canvas iframe auto-resize (canonical pattern) --- */
  var PAD = 4, lastH = 0;
  function sendHeight(){
    try{
      var el = document.querySelector('.wrap');
      var h = (el ? el.offsetHeight : document.body.offsetHeight) + PAD;
      if (Math.abs(h - lastH) < 4) return;
      lastH = h;
      var msg = {subject:'lti.frameResize', height:h};
      window.parent.postMessage(msg,'*');
      window.parent.postMessage(JSON.stringify(msg),'*');
    }catch(e){}
  }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  document.addEventListener('toggle', function(){ setTimeout(sendHeight, 60); }, true);
  if(window.ResizeObserver){
    var w = document.querySelector('.wrap');
    if(w) new ResizeObserver(sendHeight).observe(w);
  }
  sendHeight();
})();
</script>
</body>
</html>
