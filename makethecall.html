<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make the Call</title>
<style>
  :root{
    --green:#154734; --gold:#FFB81C; --amber:#D99A1C;
    --accent:#5E8A93; --accent-dk:#2F5A62;
    --cream:#FAF6EC; --sage:#E7EFE9; --palegold:#FBF3DC;
    --char:#2B2B2B; --gray:#6F6F6F; --line:#D6D2C8; --brick:#9C3F2C;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{padding:12px;background:var(--cream);color:var(--char);
       font-family:Lato,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .hdr{background:var(--green);color:#fff;border-radius:10px 10px 0 0;padding:16px 20px;
       border-bottom:5px solid var(--accent)}
  .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
           color:var(--gold);margin:0 0 4px}
  .hdr h1{margin:0;font-size:1.32rem;font-weight:700}
  .hdr p{margin:6px 0 0;font-size:.94rem;color:#E3EDE7}

  .body{background:#fff;border:1px solid var(--line);border-top:0;
        border-radius:0 0 10px 10px;padding:20px}

  .progress{display:flex;align-items:center;gap:8px;font-size:.75rem;font-weight:800;
            letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dk);margin:0 0 14px}
  .pips{display:flex;gap:5px;margin-left:auto}
  .pip{width:24px;height:5px;border-radius:3px;background:var(--line)}
  .pip.on{background:var(--accent)}
  .pip.done{background:var(--green)}

  .scene{background:var(--sage);border-left:5px solid var(--accent);
         border-radius:0 8px 8px 0;padding:15px 17px;margin:0 0 16px}
  .scene .tag{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
              color:var(--accent-dk);display:block;margin-bottom:5px}
  .scene p{margin:0 0 9px}
  .scene p:last-child{margin-bottom:0}
  .ask{font-weight:700;color:var(--green)}

  .qlabel{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
          color:var(--gray);margin:0 0 9px}
  .opts{display:grid;gap:9px}
  @media(min-width:560px){.opts{grid-template-columns:repeat(3,1fr)}}
  .opt{width:100%;text-align:center;font:inherit;font-weight:700;color:var(--green);
       cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:8px;
       padding:13px 12px;transition:border-color .13s,background .13s}
  .opt:hover{border-color:var(--accent);background:#F7FAFA}
  .opt:focus-visible{outline:3px solid var(--green);outline-offset:2px}
  .opt[aria-pressed="true"]{border-color:var(--green);background:var(--sage)}
  .opt[disabled]{cursor:default;opacity:.6}
  .opt[disabled][aria-pressed="true"]{opacity:1}

  .fb{margin-top:16px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .fb-top{padding:11px 15px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;
          border-bottom:1px solid var(--line)}
  .stamp{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
         color:#fff;padding:4px 11px;border-radius:20px}
  .s-yes{background:var(--green)}
  .s-no{background:var(--brick)}
  .t-yes{background:var(--sage)}
  .t-no{background:#F7E9E5}
  .fb-top .lbl{font-weight:700;font-size:.95rem}
  .fb-top .mark{font-size:.78rem;font-weight:800;letter-spacing:.06em;
                text-transform:uppercase;color:var(--gray);margin-left:auto}
  .fb-body{padding:14px 16px}
  .fb-body p{margin:0 0 10px}
  .fb-body p:last-child{margin-bottom:0}

  .beat{border:1px solid var(--line);border-left:4px solid var(--accent);
        border-radius:0 8px 8px 0;padding:12px 14px;margin:0 0 10px;background:#FCFBF7}
  .beat:last-child{margin-bottom:0}
  .beat h4{margin:0 0 5px;font-size:.78rem;font-weight:800;letter-spacing:.07em;
           text-transform:uppercase;color:var(--accent-dk)}
  .beat p{margin:0;font-size:.95rem}
  .beat.good{border-left-color:var(--gold);background:var(--palegold)}
  .beat.good h4{color:#8A6A14}

  .acts{margin-top:15px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .btn{font:inherit;font-weight:700;font-size:.93rem;cursor:pointer;border-radius:7px;
       padding:10px 18px;border:2px solid var(--green);background:var(--green);color:#fff}
  .btn:hover{background:#0F3627}
  .btn:focus-visible{outline:3px solid var(--accent-dk);outline-offset:2px}
  .btn.ghost{background:#fff;color:var(--green)}
  .btn.ghost:hover{background:var(--sage)}
  .btn[disabled]{opacity:.45;cursor:default}
  .hint{font-size:.85rem;color:var(--gray)}

  .recap{background:var(--green);color:#fff;border-radius:10px;padding:20px;margin-top:18px}
  .recap h2{margin:0 0 6px;font-size:1.08rem;color:var(--gold)}
  .recap p{margin:0 0 12px;color:#E3EDE7;font-size:.95rem}
  .lens{display:grid;gap:10px}
  @media(min-width:560px){.lens{grid-template-columns:1fr 1fr}}
  .lenscard{background:rgba(255,255,255,.09);border-radius:8px;padding:13px 15px;font-size:.93rem}
  .lenscard b{display:block;color:var(--gold);font-size:.74rem;letter-spacing:.07em;
              text-transform:uppercase;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <p class="eyebrow">Module 2 &middot; Evaluate the Ethics</p>
    <h1>Make the Call</h1>
    <p>Three situations. Decide before you open the ruling. Nothing here is graded.</p>
  </div>

  <div class="body">
    <div id="stage" aria-live="polite"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var CARDS = [
    {
      tag: "Campus marketing",
      scene: [
        "You need a graphic to promote Diadeloso. You prompt an AI image generator with keywords naming a famous living digital artist, and the result is exactly the look you wanted.",
        "Student Activities loves it and puts it on the event page and the shirts."
      ],
      ask: "Who owns the graphic?",
      opts: ["The student who made it", "Student Activities", "Nobody"],
      answer: 2,
      stamp: "no", stampText: "Nobody",
      lbl: "Nobody owns it.",
      beats: [
        { h: "The copyright truth",
          p: "The image was generated entirely by AI from prompts, and U.S. copyright protects human authorship and only human authorship. There is no author here, so there is nothing to own. If another university screenshots your graphic for their own spring event, they are not stealing your intellectual property. There is no property to steal." },
        { h: "The Honor Code reality",
          p: "The copyright answer does not get you off the hook. The moment you put your name on that graphic and submit it for a grade, or tell people you designed it, you have crossed a line that does have teeth. The Honor Code requires you to be truthful about authorship." },
        { h: "The ethical dilemma",
          p: "The model learned to draw like that artist by training on her copyrighted work, without asking. You then used her name as a keyword to make something that competes with what she sells. All of that is legal. Whether it is fair to her is your call, and the law is not going to make it for you." }
      ]
    },
    {
      tag: "The op-ed",
      scene: [
        "Maya asks an AI tool for a rough draft of an op-ed for the Lariat. She reads it, throws out its structure, rewrites nearly every sentence in her own voice, and adds three arguments it never made.",
        "What ran in the paper shares almost no language with what the AI produced."
      ],
      ask: "Who owns the published op-ed?",
      opts: ["Maya", "Nobody", "The Lariat"],
      answer: 0,
      stamp: "yes", stampText: "Maya",
      lbl: "Maya does.",
      beats: [
        { h: "Why",
          p: "Copyright protects human expression. The sentences she wrote, the structure she chose, and the arguments she built are hers, and they are essentially the whole finished piece. The AI's original draft was never protectable, which barely matters here, because almost none of it survived." },
        { h: "The case worth remembering",
          p: "&ldquo;AI was involved&rdquo; does not mean &ldquo;you own nothing.&rdquo; What you substantially wrote, arranged, or changed is yours. The more of the finished work you actually made, the more of it you hold." }
      ]
    },
    {
      tag: "The library article",
      scene: [
        "You have a journal article you downloaded through a Baylor Libraries database. It is dense, it is twenty-eight pages, and seminar is tomorrow.",
        "You want to upload the PDF and ask an AI tool to summarize it."
      ],
      ask: "Can you upload it?",
      opts: ["Yes", "Only into Copilot or Box AI", "No"],
      answer: 2,
      stamp: "no", stampText: "No",
      lbl: "No. Not to any tool.",
      beats: [
        { h: "Why",
          p: "Uploading library materials to any AI platform, including Copilot and Box AI, violates Baylor's licensing agreement with publishers. The restriction lives in the contract the Libraries signed, and a Data Processing Agreement protects your data rather than buying you rights to a publisher's article." },
        { h: "What does work",
          p: "Your notes are yours. Read the article, write down what you understood, and upload those notes to any AI tool you like. Ask it to check your reasoning, push on your interpretation, or explain the part you could not follow. That is also the version where you actually learn the article." },
        { h: "The good news",
          p: "There are ways to use AI to help you understand research articles that will not violate copyright, and there are AI tools inside the library databases you can use to assist with research. Modules 4 and 5 will show you ethical ways to use AI as a reading and research assistant." }
      ]
    }
  ];

  var SNAME = { yes: "s-yes", no: "s-no" };
  var TNAME = { yes: "t-yes", no: "t-no" };

  var stage = document.getElementById("stage");
  var idx = 0;
  var picked = CARDS.map(function(){ return null; });

  function pips(){
    var out = '<span class="pips" aria-hidden="true">';
    for (var i = 0; i < CARDS.length; i++){
      out += '<span class="' + (i === idx ? "pip on" : (picked[i] !== null ? "pip done" : "pip")) + '"></span>';
    }
    return out + '</span>';
  }

  function render(){
    var c = CARDS[idx], sel = picked[idx], html = '';

    html += '<div class="progress">Situation ' + (idx + 1) + ' of ' + CARDS.length + pips() + '</div>';

    html += '<div class="scene"><span class="tag">' + c.tag + '</span>';
    c.scene.forEach(function(p){ html += '<p>' + p + '</p>'; });
    html += '<p class="ask">' + c.ask + '</p></div>';

    html += '<p class="qlabel">Your verdict</p>';
    html += '<div class="opts" role="group" aria-label="' + c.ask + '">';
    c.opts.forEach(function(t, i){
      html += '<button class="opt" type="button" data-i="' + i + '"'
            + ' aria-pressed="' + (sel === i) + '"'
            + (sel !== null ? ' disabled' : '') + '>' + t + '</button>';
    });
    html += '</div>';

    if (sel !== null){
      var right = (sel === c.answer);
      html += '<div class="fb">'
            + '<div class="fb-top ' + TNAME[c.stamp] + '">'
            + '<span class="stamp ' + SNAME[c.stamp] + '">' + c.stampText + '</span>'
            + '<span class="lbl">' + c.lbl + '</span>'
            + '<span class="mark">' + (right ? 'You had it' : 'Worth a second look') + '</span>'
            + '</div><div class="fb-body">';
      c.beats.forEach(function(b){
        var cls = (b.h === "The good news") ? "beat good" : "beat";
        html += '<div class="' + cls + '"><h4>' + b.h + '</h4><p>' + b.p + '</p></div>';
      });
      html += '</div></div>';
    }

    html += '<div class="acts">';
    html += '<button class="btn ghost" type="button" id="prev"' + (idx === 0 ? ' disabled' : '') + '>Previous</button>';
    if (idx < CARDS.length - 1){
      html += '<button class="btn" type="button" id="next"' + (sel === null ? ' disabled' : '') + '>Next situation</button>';
    }
    if (sel === null){ html += '<span class="hint">Choose a verdict to see the ruling.</span>'; }
    html += '</div>';

    if (idx === CARDS.length - 1 && sel !== null){
      html += '<div class="recap"><h2>Two questions, opposite directions</h2>'
            + '<p>Every situation here was one of these.</p>'
            + '<div class="lens">'
            + '<div class="lenscard"><b>Coming out</b>Who made the expression? That is who owns it. If the answer is the machine, nobody does, and nobody can promise anyone otherwise.</div>'
            + '<div class="lenscard"><b>Going in</b>Whose is it to put in? Yours, or someone whose permission you actually have. Available to you is not the same as yours to use.</div>'
            + '</div></div>';
      html += '<div class="acts"><button class="btn ghost" type="button" id="restart">Start over</button></div>';
    }

    stage.innerHTML = html;
    wire();
    bump();
  }

  function wire(){
    Array.prototype.forEach.call(stage.querySelectorAll(".opt"), function(b){
      b.addEventListener("click", function(){
        if (picked[idx] !== null) return;
        picked[idx] = parseInt(b.getAttribute("data-i"), 10);
        render();
      });
    });
    var p = document.getElementById("prev");
    if (p) p.addEventListener("click", function(){ if (idx > 0){ idx--; render(); } });
    var n = document.getElementById("next");
    if (n) n.addEventListener("click", function(){ idx++; render(); });
    var r = document.getElementById("restart");
    if (r) r.addEventListener("click", function(){
      idx = 0; picked = CARDS.map(function(){ return null; }); render();
    });
  }

  /* --- Canvas iframe auto-resize (canonical pattern) --- */
  var PAD = 24, lastH = 0;
  function sendHeight(){
    try{
      var el = document.querySelector('.wrap');
      var h = (el ? el.offsetHeight : document.body.offsetHeight) + PAD;
      if (Math.abs(h - lastH) < 4) return;
      lastH = h;
      var msg = {subject:'lti.frameResize', height:h};
      window.parent.postMessage(msg,'*');
      window.parent.postMessage(JSON.stringify(msg),'*');
    }catch(e){}
  }
  function bump(){ setTimeout(sendHeight, 80); }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  if(window.ResizeObserver){
    var w = document.querySelector('.wrap');
    if(w) new ResizeObserver(sendHeight).observe(w);
  }

  render();
})();
</script>
</body>
</html>
